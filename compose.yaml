services:
  reports:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      REPORT_WRITE_TOKEN: ${REPORT_WRITE_TOKEN:?Set a 32+ character write token}
      REPORT_READ_TOKEN: ${REPORT_READ_TOKEN:?Set a different 32+ character read token}
      REPORT_TRUSTED_KEYS: ${REPORT_TRUSTED_KEYS:?Set a JSON array of independently pinned public keys}
    volumes:
      - report-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 80
    mem_limit: 256m
volumes:
  report-data:
